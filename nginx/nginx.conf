user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    server_tokens off;

    # =========================================================================
    # PUFFER- & BODY-LIMITS (Verhindert Abschneiden & leere $request_body)
    # =========================================================================
    # client_body_buffer_size 1m: Hält Payloads bis 1 MB direkt im RAM, sodass
    # $request_body im Access-Log vollständig befüllt ist (nicht mehr leer "").
    # client_max_body_size 25m: Erlaubt große Multipart-Uploads (php2shell Arming).
    client_body_buffer_size 1m;
    client_body_in_single_buffer on;
    client_max_body_size 25m;

    # =========================================================================
    # ERWEITERTES JSON-LOGFORMAT (Alle Erkennungsmerkmale für php2shell)
    # =========================================================================
    log_format json_honeypot escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"sensor":"nginx-honeypot",'
            '"src_ip":"$remote_addr",'
            '"src_port":$remote_port,'
            '"dst_port":$server_port,'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"http_version":"$server_protocol",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_length":$request_length,'
            '"request_time":$request_time,'
            '"content_length":"$http_content_length",'
            '"content_type":"$http_content_type",'
            '"transfer_encoding":"$http_transfer_encoding",'
            '"http_host":"$http_host",'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer",'
            '"cookie_phpsessid":"$cookie_PHPSESSID",'
            '"cookie":"$http_cookie",'
            '"request_body":"$request_body"'
        '}';

    # Haupt-Logdatei des Honeypots
    access_log /var/log/nginx/honeypot.log json_honeypot;

    # Interner Trap-Upstream: Zwingt NGINX, den Request-Body im Speicher einzulesen
    upstream internal_trap {
        server 127.0.0.1:8088;
    }

    # =========================================================================
    # ÖFFENTLICHER SERVER: PORT 80 (HTTP)
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Leitet alle Anfragen an das interne Backend weiter, um den Body
        # einzulesen und im json_honeypot-Log zu protokollieren.
        location / {
            proxy_pass http://internal_trap;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # ÖFFENTLICHER SERVER: PORT 443 (HTTPS)
    # =========================================================================
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://internal_trap;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # INTERNES BACKEND: PORT 8088 (HONEYPOT DECOYS & FAKE PHP LOGIK)
    # =========================================================================
    server {
        listen 127.0.0.1:8088;
        server_name _;

        # Kein doppeltes Logging: Das Frontend auf 80/443 protokolliert bereits
        access_log off;

        # Gefälschte PHP 8.1.2 & Apache-Signaturen (macht PHP für Scanner sichtbar)
        add_header Server "Apache/2.4.52 (Ubuntu)" always;
        add_header X-Powered-By "PHP/8.1.2" always;
        add_header Set-Cookie "PHPSESSID=d41d8cd98f00b204e9800998ecf8427e; path=/; HttpOnly" always;

        # ---------------------------------------------------------------------
        # 1. KÖDER FÜR SCANNER: HTTP 200 AUF ROOT (/) & INDEX (/index.php)
        # ---------------------------------------------------------------------
        location = / {
            add_header Content-Type "text/html; charset=UTF-8" always;
            return 200 '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8"><title>Corporate Portal &bull; Welcome</title></head><body class="home blog"><header><h1>Corporate IT Portal</h1><p>Running PHP 8.1.2 &amp; WordPress 6.5.2</p></header><main><article><h2>Welcome</h2><p>Our website is undergoing scheduled maintenance. Please log in via <a href="/wp-login.php">Staff Login</a>.</p></article></main></body></html>\n';
        }

        # ---------------------------------------------------------------------
        # 2. LFI-INJEKTIONS-KÖDER FÜR php2shell (/index.php mit Query-Parametern)
        # ---------------------------------------------------------------------
        location = /index.php {
            add_header Content-Type "text/html; charset=UTF-8" always;

            # Wenn Angreifer /tmp/sess_*, php://filter, etc/passwd oder Pfad-Traversal testen:
            # Täuscht eine authentische PHP-Inklusionswarnung vor!
            if ($args ~* "(page|file|include|view|lang|doc|path|read)=.*(\/tmp\/sess|php:\/\/|etc\/passwd|\.\.\/)") {
                return 200 '<br />\n<b>Warning</b>: include(): Failed opening target for inclusion (include_path=".:/usr/share/php") in <b>/var/www/html/index.php</b> on line <b>34</b><br />\n';
            }
            if ($args ~* "(page|file|include|view|lang|doc|path|read)=") {
                return 200 '<br />\n<b>Warning</b>: include(): Filename cannot be empty in <b>/var/www/html/index.php</b> on line <b>34</b><br />\n';
            }

            # Normaler Aufruf von /index.php (oder Exploit-Arming-POST):
            return 200 '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8"><title>Corporate Portal &bull; Home</title></head><body><h1>Corporate Portal</h1><p>PHP 8.1.2 Environment Active</p></body></html>\n';
        }

        # ---------------------------------------------------------------------
        # 3. PHP-RECONNAISSANCE PFADE (phpinfo-Scanner)
        # ---------------------------------------------------------------------
        location ~* ^/(phpinfo|info|php|pi|test|vuln)\.php$ {
            add_header Content-Type "text/html; charset=UTF-8" always;
            return 200 '<!DOCTYPE html><html><head><title>phpinfo()</title></head><body><h1>PHP Version 8.1.2-1ubuntu2.14</h1><p>System: Linux ubuntu 5.15.0-89-generic #99-Ubuntu SMP</p><p>Server API: FPM/FastCGI</p><p>session.upload_progress.enabled: On</p><p>session.upload_progress.prefix: upload_progress_</p><p>session.upload_progress.name: PHP_SESSION_UPLOAD_PROGRESS</p><p>DOCUMENT_ROOT: /var/www/html</p></body></html>\n';
        }

        # ---------------------------------------------------------------------
        # 4. WORDPRESS-KÖDER & TARPIT
        # ---------------------------------------------------------------------
        location = /wp-login.php {
            limit_rate 10;
            add_header Set-Cookie "wordpress_test_cookie=WP+Cookie+check; path=/" always;
            add_header Set-Cookie "PHPSESSID=8k1059fba834hf92011; path=/" always;
            add_header Content-Type "text/html; charset=UTF-8" always;
            return 200 '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8"><title>Log In - WordPress</title></head><body class="login login-action-login wp-core-ui"><div id="login"><h1><a href="https://wordpress.org/">WordPress</a></h1><form name="loginform" id="loginform" action="/wp-login.php" method="post"><p><label for="user_login">Username<br><input type="text" name="log" id="user_login" size="20"/></label></p><p><label for="user_pass">Password<br><input type="password" name="pwd" id="user_pass" size="20"/></label></p><p class="submit"><input type="submit" name="wp-submit" id="wp-submit" class="button button-primary" value="Log In"/></p></form></div></body></html>';
        }

        location /wp-admin/ {
            return 302 /wp-login.php?redirect_to=%2Fwp-admin%2F;
        }

        location = /xmlrpc.php {
            add_header Content-Type "text/xml; charset=UTF-8" always;
            return 200 '<?xml version="1.0" encoding="UTF-8"?><methodResponse><fault><value><struct><member><name>faultCode</name><value><int>-32700</int></value></member></struct></value></fault></methodResponse>';
        }

        location /wp-json/ {
            return 200 '{"name":"Corporate Site","namespaces":["oembed/1.0","wp/v2"]}';
        }

        location /phpmyadmin/ {
            return 200 '<title>phpMyAdmin</title><form method="post"><input type="text" name="pma_username"/><input type="password" name="pma_password"/><input type="submit"/></form>';
        }

        location /wp-content/uploads/ {
            add_header Content-Type "text/html" always;
            return 200 '<html><body><h1>Index of /wp-content/uploads/</h1><a href="backup-2025.zip">backup-2025.zip</a><br><a href="webshell.php.bak">webshell.php.bak</a></body></html>';
        }

        # ---------------------------------------------------------------------
        # 5. CANARY-TOKENS, DATABASE- & GIT-KÖDER
        # ---------------------------------------------------------------------
        location = /.env {
            add_header Content-Type "text/plain" always;
            return 200 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=wordpress\nDB_USERNAME=admin\nDB_PASSWORD=SuperSecretAdminPass!2026\n\n# AWS Canary Deploy Keys\nAWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\nAWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n';
        }

        location = /.git/config {
            add_header Content-Type "text/plain" always;
            return 200 '[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = false\n[remote "origin"]\n\turl = https://github.com/company/secret-repo.git\n';
        }

        location = /database_dump.sql {
            add_header Content-Type "application/sql" always;
            return 200 '-- MySQL dump 10.13\nDROP TABLE IF EXISTS `users`;\nCREATE TABLE `users` (id int, username varchar(50), password varchar(255));\nINSERT INTO `users` VALUES (1,"admin","5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8");\n';
        }

        location ~* passwd {
            add_header Content-Type "text/plain" always;
            return 200 'root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin\nadmin:x:1000:1000:admin,,,:/home/admin:/bin/bash\n';
        }

        location = /cmd.php {
            add_header Content-Type "text/plain" always;
            return 200 'uid=33(www-data) gid=33(www-data) groups=33(www-data)\nsh: 1: cannot create temp file: Permission denied\n';
        }

        # ---------------------------------------------------------------------
        # 6. SCANNER-FALLEN & ABWEHR
        # ---------------------------------------------------------------------
        location ~* (backup|old|dev|test) {
            add_header Content-Type "text/html; charset=UTF-8" always;
            return 500 '<!DOCTYPE html><html><head><title>Database Error</title></head><body><h1>Error establishing a database connection</h1></body></html>';
        }

        location = /admin/secret-login/ {
            return 301 /admin/secret-login/;
        }

        location ~* (shadow|config\.php|\.sql) {
            return 403 '403 Forbidden - Access Denied by Security Policy';
        }

        location = /robots.txt {
            add_header Content-Type "text/plain" always;
            return 200 'User-agent: *\nDisallow: /wp-admin/\nDisallow: /secret-admin-login/\nDisallow: /database-backup-2026/\nDisallow: /database_dump.sql\n';
        }

        # Standard-Fallback für alle anderen unbekannten URIs
        location / {
            return 404 'Not Found';
        }
    }
}
