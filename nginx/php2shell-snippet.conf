# =============================================================================
# NGINX KONFIGURATIONS-SNIPPET: PHP_SESSION_UPLOAD_PROGRESS / LFI SCHWACHSTELLE
# =============================================================================
# Dieses Snippet enthält alle Komponenten, die speziell für das Anlocken,
# Abfangen und Mitschneiden von php2shell- und LFI-Angriffen benötigt werden.

# -----------------------------------------------------------------------------
# TEIL 1: Im "http { ... }" Block einfügen
# -----------------------------------------------------------------------------
# Vergrößert die Puffer, damit NGINX Payloads bis 1 MB direkt im RAM hält
# und der Body im Log nicht leer ("") bleibt.
client_body_buffer_size 1m;
client_body_in_single_buffer on;
client_max_body_size 25m;

# Erweitertes JSON-Logformat mit allen Exploit-Feldern:
log_format json_honeypot escape=json
    '{'
        '"ts":"$time_iso8601",'
        '"sensor":"nginx-honeypot",'
        '"src_ip":"$remote_addr",'
        '"src_port":$remote_port,'
        '"dst_port":$server_port,'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"http_version":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"content_length":"$http_content_length",'
        '"content_type":"$http_content_type",'
        '"transfer_encoding":"$http_transfer_encoding",'
        '"http_host":"$http_host",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"cookie_phpsessid":"$cookie_PHPSESSID",'
        '"cookie":"$http_cookie",'
        '"request_body":"$request_body"'
    '}';

# Interner Proxy-Trap Upstream (zwingt NGINX, den Request-Body einzulesen):
upstream internal_trap {
    server 127.0.0.1:8088;
}


# -----------------------------------------------------------------------------
# TEIL 2: In den öffentlichen "server { listen 80; ... }" und "server { listen 443 ssl; ... }"
# -----------------------------------------------------------------------------
location / {
    proxy_pass http://internal_trap;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# -----------------------------------------------------------------------------
# TEIL 3: Die Fallen und Köder (im internen Server auf 127.0.0.1:8088)
# -----------------------------------------------------------------------------
# 1. Täuscht PHP 8.1.2 und eine aktive PHP-Session vor:
add_header Server "Apache/2.4.52 (Ubuntu)" always;
add_header X-Powered-By "PHP/8.1.2" always;
add_header Set-Cookie "PHPSESSID=d41d8cd98f00b204e9800998ecf8427e; path=/; HttpOnly" always;

# 2. Scanner-Köder: HTTP 200 auf Root (/) statt 404
location = / {
    add_header Content-Type "text/html; charset=UTF-8" always;
    return 200 '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8"><title>Corporate Portal &bull; Welcome</title></head><body class="home blog"><header><h1>Corporate IT Portal</h1><p>Running PHP 8.1.2 &amp; WordPress 6.5.2</p></header><main><article><h2>Welcome</h2><p>Our website is undergoing scheduled maintenance. Please log in via <a href="/wp-login.php">Staff Login</a>.</p></article></main></body></html>\n';
}

# 3. LFI-Falle auf /index.php (täuscht verwundbare Inklusion vor):
location = /index.php {
    add_header Content-Type "text/html; charset=UTF-8" always;

    # Wenn Angreifer nach /tmp/sess_*, php://filter, etc/passwd suchen:
    if ($args ~* "(page|file|include|view|lang|doc|path|read)=.*(\/tmp\/sess|php:\/\/|etc\/passwd|\.\.\/)") {
        return 200 '<br />\n<b>Warning</b>: include(): Failed opening target for inclusion (include_path=".:/usr/share/php") in <b>/var/www/html/index.php</b> on line <b>34</b><br />\n';
    }
    if ($args ~* "(page|file|include|view|lang|doc|path|read)=") {
        return 200 '<br />\n<b>Warning</b>: include(): Filename cannot be empty in <b>/var/www/html/index.php</b> on line <b>34</b><br />\n';
    }

    # Normaler Aufruf / Exploit-Arming POST:
    return 200 '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8"><title>Corporate Portal &bull; Home</title></head><body><h1>Corporate Portal</h1><p>PHP 8.1.2 Environment Active</p></body></html>\n';
}

# 4. PHP-Reconnaissance Falle (signalisiert session.upload_progress.enabled):
location ~* ^/(phpinfo|info|php|pi|test|vuln)\.php$ {
    add_header Content-Type "text/html; charset=UTF-8" always;
    return 200 '<!DOCTYPE html><html><head><title>phpinfo()</title></head><body><h1>PHP Version 8.1.2-1ubuntu2.14</h1><p>System: Linux ubuntu 5.15.0-89-generic #99-Ubuntu SMP</p><p>Server API: FPM/FastCGI</p><p>session.upload_progress.enabled: On</p><p>session.upload_progress.prefix: upload_progress_</p><p>session.upload_progress.name: PHP_SESSION_UPLOAD_PROGRESS</p><p>DOCUMENT_ROOT: /var/www/html</p></body></html>\n';
}
